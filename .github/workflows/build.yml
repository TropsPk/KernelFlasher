name: Android Build
permissions:
  contents: write
on:
  workflow_dispatch:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build with Gradle
        run: |
          chmod +x ./gradlew 
          ./gradlew assembleRelease
          tree app/build/outputs/apk/release

      - name: Require signing secrets
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          KS: ${{ secrets.KEYSTORE }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS" ] || [ -z "$KS_ALIAS" ] || [ -z "$KS_PASS" ]; then
            echo "::error::Missing KEYSTORE / KEY_ALIAS / KEYSTORE_PASSWORD secrets. Refusing to build an unsigned or throwaway-signed APK."
            exit 1
          fi

      - name: Sign app APK
        if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        id: sign_app
        env:
          RELEASE_DIR: app/build/outputs/apk/release
          SIGNING_KEY_BASE64: ${{ secrets.KEYSTORE }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          BUILD_TOOLS_VERSION: "35.0.0"
        run: bash .github/scripts/sign-apk.sh

      - name: Rename APK
        if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          ls -al app/build/outputs/apk/release
          SIGNED="${{ steps.sign_app.outputs.signedReleaseFile }}"
          echo "Signed APK: $SIGNED"
          cp "$SIGNED" KernelFlasher_${{ github.run_number }}.apk

      - name: Rename APK
        if: github.repository != github.event.pull_request.head.repo.full_name && github.event_name == 'pull_request'
        run: |
          ls -al app/build/outputs/apk/release
          cp ./app/build/outputs/apk/release/app-release-unsigned.apk KernelFlasher_${{ github.run_number }}.apk

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: KernelFlasher_${{ github.run_number }}
          path: KernelFlasher_${{ github.run_number }}.apk
